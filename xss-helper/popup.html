<!DOCTYPE html>
<html>
<head>
    <title>XSS Helper</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>
    <h3>XSS Helper</h3>

    <div class="error-message" id="errorMessage"></div>

    <div class="content-container" id="contentContainer">
        <div class="settings">
            <div class="settings-row">
                <label><input type="checkbox" id="removeLineBreaks">Remove line breaks</label>
            </div>
        </div>
        <div class="row">
            <input type="number" id="numLines" min="1" max="100" value="5">
            <button id="copyRandom">Copy X lines</button>
        </div>
        <div class="row">
            <button id="copyAll">Copy All Lines</button>
        </div>
        <div class="footer-links">
            <a href="https://chromewebstore.google.com/detail/xss-helper/kcbilpohfnnamoddophbdakcafkfjjba" target="_blank">about</a>
            &nbsp;|&nbsp;
            <a href="https://github.com/x0h01/chrome-plugins" target="_blank">github</a>
        </div>
    </div>
  
    <script src="js/popup.js"></script>
</body>
</html>

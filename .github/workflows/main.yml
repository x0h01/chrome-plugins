name: Build and Release Extensions

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses:  actions/checkout@v3

      - name: Extract extension name and version
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          EXTENSION_NAME=$(echo $TAG | cut -d'/' -f1)
          VERSION=$(echo $TAG | cut -d'/' -f2)
          echo "extension=$EXTENSION_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name:  Extract changelog for this version
        run: |
          EXTENSION=${{ steps.extract.outputs.extension }}
          VERSION=${{ steps.extract.outputs.version }}
          
          if [ -f "$EXTENSION/CHANGELOG.md" ]; then
            # Extract the section for this version
            # This finds content between ## [version] and the next ## heading
            awk "/## \[${VERSION#v}\]/,/^## \[/" "$EXTENSION/CHANGELOG.md" | sed '/^## \['"${VERSION#v}"'\]/d; $d' > release_notes.md
          
            # Check if we extracted anything
            if [ !  -s release_notes.md ]; then
              echo "⚠️ No changelog entry found for version ${VERSION#v}" > release_notes.md
              echo "" >> release_notes.md
              echo "Please update $EXTENSION/CHANGELOG.md" >> release_notes.md
            fi
          else
            echo "⚠️ No CHANGELOG.md found in $EXTENSION/" > release_notes.md
          fi
          
          # Add installation instructions
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Installation" >> release_notes.md
          echo "Download the zip file below and load it as an unpacked extension in Chrome." >> release_notes. md

      - name: Create zip file
        run: |
          cd ${{ steps.extract.outputs.extension }}
          zip -r ../${{ steps.extract.outputs.extension }}-${{ steps. extract.outputs.version }}.zip . \
            -x "*. git*" "node_modules/*" "*.DS_Store" "*.md" "package*.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files:  ${{ steps.extract.outputs. extension }}-${{ steps.extract.outputs.version }}.zip
          tag_name: ${{ steps.extract.outputs.tag }}
          name: ${{ steps.extract.outputs.extension }} ${{ steps.extract.outputs.version }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
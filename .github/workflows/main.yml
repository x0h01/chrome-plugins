name: Build and Release Extensions

on:
  push:
    tags:
      - '*/v*' # to match any tag like xss-helper/v1.1

permissions:
  contents: write  # allow creating releases

jobs:
  release: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract extension name and version
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          EXTENSION_NAME=$(echo $TAG | cut -d'/' -f1)
          VERSION=$(echo $TAG | cut -d'/' -f2)
          echo "extension=$EXTENSION_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create zip file
        run: |
          cd ${{ steps.extract.outputs.extension }}
          zip -r ../${{ steps.extract.outputs.extension }}-${{ steps.extract.outputs.version }}.zip .  \
            -x "*.git*" "*.DS_Store" "*.md" "package*.json"

      - name: Generate changelog
        id: changelog
        run: |
          EXTENSION=${{ steps.extract.outputs.extension }}
          if [ -f "$EXTENSION/CHANGELOG.md" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            cat $EXTENSION/CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.extract.outputs.extension }}-${{ steps.extract.outputs.version }}.zip
          tag_name: ${{ steps.extract.outputs.tag }}
          name: ${{ steps.extract.outputs.extension }} ${{ steps.extract.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
